[global]
    server role = standalone server
    workgroup = WORKGROUP
    netbios name = DENIZ-CLOUD
    server string = Deniz Cloud storage
    security = user
    passdb backend = tdbsam
    logging = systemd

    # tailscale0 is a non-broadcast /32 interface. Binding Samba to it is not
    # reliable; the dedicated nftables unit restricts the wildcard socket.
    bind interfaces only = no
    hosts allow = 127.0.0.1 100.64.0.0/10 fd7a:115c:a1e0::/48
    hosts deny = ALL
    smb ports = 445
    disable netbios = yes
    dns proxy = no
    server min protocol = SMB3_00
    server max protocol = SMB3_11
    server smb encrypt = required
    server signing = mandatory
    map to guest = never
    restrict anonymous = 2
    usershare max shares = 0
    smb1 unix extensions = no
    smb3 unix extensions = no
    allow insecure wide links = no
    load printers = no
    disable spoolss = yes
    printcap name = /dev/null

    fruit:aapl = yes
    fruit:copyfile = no
    fruit:nfs_aces = no
    smb2 leases = no
    oplocks = no
    level2 oplocks = no
    kernel oplocks = no
    kernel share modes = no
    posix locking = yes
    strict locking = yes

[Personal]
    # NOT %H. Samba expands %H to the home of the user it is *operating as*,
    # which with `force user` is the storage user — so every device landed in
    # /home/denizlg24 instead of its account root, serving the Pi's home
    # directory over SMB. Verified live on 2026-08-05.
    #
    # Each device principal instead gets a generated fragment naming its
    # account root. A principal with no fragment falls through to a path that
    # does not exist, so an unprovisioned device fails closed rather than
    # landing somewhere arbitrary.
    path = /srv/deniz-cloud/unprovisioned
    include = /etc/samba/deniz-cloud-personal/%U.conf
    # Gate 1B (2026-08-05) closed the reserved-ADS hole by removing
    # streams_xattr; the attack suite passes against this exact config. The
    # share stays disabled by default so enabling human drives remains a
    # deliberate operator action after the client matrix passes.
    available = no
    read only = no
    browseable = yes
    guest ok = no
    valid users = @deniz-cloud-smb
    # Samba resolves these by name, not by id — a numeric value fails tree
    # connect with NT_STATUS_NO_SUCH_USER. Every existing storage file is
    # 1000:1000, but gid 1000 belongs to a system group whose name differs per
    # host, so the installer creates `deniz-cloud-storage` as a second name for
    # gid 1000 and the config refers to that.
    force user = denizlg24
    force group = deniz-cloud-storage
    create mask = 0660
    directory mask = 0770
    force create mode = 0660
    force directory mode = 0770
    follow symlinks = no
    wide links = no
    durable handles = no
    strict sync = yes
    sync always = yes
    ea support = yes
    # No streams_xattr. Gate 1 failed because a client could write
    # <file>:user.denizcloud.id, and Gate 1B reproduced it verbatim under
    # security.*: the raw xattr stayed intact, but streams_xattr still created
    # an enumerable alias with a protected-looking name, which is the
    # ambiguous metadata channel the ADR calls terminal. Samba has no filter
    # for stream names — veto files does not apply to them — so the module is
    # removed instead. Creating any alternate stream now fails with
    # NT_STATUS_OBJECT_NAME_INVALID.
    #
    # Nothing is lost that this namespace wanted: the ADR already states
    # alternate streams are protocol metadata and never namespace entries.
    # macOS resource forks and Finder metadata continue through AppleDouble
    # sidecars via fruit:resource=file and fruit:metadata=netatalk.
    vfs objects = catia fruit full_audit
    fruit:resource = file
    fruit:metadata = netatalk
    fruit:encoding = native
    fruit:locking = none
    fruit:posix_rename = yes
    fruit:veto_appledouble = yes
    fruit:zero_file_id = yes
    full_audit:prefix = %u|%I|%S
    full_audit:success = connect disconnect mkdirat renameat unlinkat openat create_file close write pwrite fsync_send
    full_audit:failure = connect mkdirat renameat unlinkat openat create_file write pwrite
    full_audit:facility = LOCAL7
    full_audit:priority = NOTICE

[Shared]
    # Deliberately not `copy = Personal`: that would inherit Personal's
    # per-principal include, which re-overrides path and would point every
    # device's Shared at its own account root.
    path = /srv/deniz-cloud/storage/shared
    available = no
    read only = no
    browseable = yes
    guest ok = no
    valid users = @deniz-cloud-smb
    force user = denizlg24
    force group = deniz-cloud-storage
    create mask = 0660
    directory mask = 0770
    force create mode = 0660
    force directory mode = 0770
    follow symlinks = no
    wide links = no
    durable handles = no
    strict sync = yes
    sync always = yes
    ea support = yes
    vfs objects = catia fruit full_audit
    fruit:resource = file
    fruit:metadata = netatalk
    fruit:encoding = native
    fruit:locking = none
    fruit:posix_rename = yes
    fruit:veto_appledouble = yes
    fruit:zero_file_id = yes
    full_audit:prefix = %u|%I|%S
    full_audit:success = connect disconnect mkdirat renameat unlinkat openat create_file close write pwrite fsync_send
    full_audit:failure = connect mkdirat renameat unlinkat openat create_file write pwrite
    full_audit:facility = LOCAL7
    full_audit:priority = NOTICE

[ApiBroker]
    # This is the only namespace path mounted into the API container. Routing
    # API/WebDAV through smbd puts all writers under Samba share-mode locking.
    path = /srv/deniz-cloud/storage
    read only = no
    browseable = no
    guest ok = no
    valid users = deniz-api-broker
    # Samba resolves these by name, not by id — a numeric value fails tree
    # connect with NT_STATUS_NO_SUCH_USER. Every existing storage file is
    # 1000:1000, but gid 1000 belongs to a system group whose name differs per
    # host, so the installer creates `deniz-cloud-storage` as a second name for
    # gid 1000 and the config refers to that.
    force user = denizlg24
    force group = deniz-cloud-storage
    create mask = 0660
    directory mask = 0770
    force create mode = 0660
    force directory mode = 0770
    follow symlinks = no
    wide links = no
    durable handles = no
    strict sync = yes
    sync always = yes
    ea support = no
    vfs objects = full_audit
    hosts allow = 127.0.0.1
    hosts deny = ALL
    # Gate1B transitional boundary only. This principal has namespace-wide
    # reach so API request-to-account authorization must gate every operation.
    # It must not be presented as the Checkpoint 5 human-access cutover.
    full_audit:prefix = api-broker|127.0.0.1|%S
    full_audit:success = connect disconnect mkdirat renameat unlinkat openat create_file close write pwrite fsync_send
    full_audit:failure = connect mkdirat renameat unlinkat openat create_file write pwrite
    full_audit:facility = LOCAL7
    full_audit:priority = NOTICE
