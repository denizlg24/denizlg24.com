[global]
    server role = standalone server
    workgroup = WORKGROUP
    netbios name = DENIZ-CLOUD
    server string = Deniz Cloud storage
    security = user
    passdb backend = tdbsam
    logging = systemd

    # tailscale0 is a non-broadcast /32 interface. Binding Samba to it is not
    # reliable; the dedicated nftables unit restricts the wildcard socket.
    bind interfaces only = no
    hosts allow = 127.0.0.1 100.64.0.0/10 fd7a:115c:a1e0::/48
    hosts deny = ALL
    smb ports = 445
    disable netbios = yes
    dns proxy = no
    server min protocol = SMB3_00
    server max protocol = SMB3_11
    server smb encrypt = required
    server signing = mandatory
    map to guest = never
    restrict anonymous = 2
    usershare max shares = 0
    smb1 unix extensions = no
    smb3 unix extensions = no
    allow insecure wide links = no
    load printers = no
    disable spoolss = yes
    printcap name = /dev/null

    fruit:aapl = yes
    fruit:copyfile = no
    fruit:nfs_aces = no
    smb2 leases = no
    oplocks = no
    level2 oplocks = no
    kernel oplocks = no
    kernel share modes = no
    posix locking = yes
    strict locking = yes

[Personal]
    # Every device principal has /srv/deniz-cloud/storage/<account UUID> as its
    # Unix home. Multiple device principals may therefore resolve to one
    # frozen API account root.
    path = %H
    # STOP: Gate 1 proved the current fruit/streams_xattr combination accepts a
    # reserved-looking ADS. This share is an installed production template, not
    # an enabled production boundary, until a deny/filter gate replaces it.
    available = no
    read only = no
    browseable = yes
    guest ok = no
    valid users = @deniz-cloud-smb
    # Numeric on purpose: every existing storage file is 1000:1000, but gid 1000
    # is not the storage user's primary group on this host. Forcing the name
    # would write a gid no existing file uses.
    force user = 1000
    force group = 1000
    create mask = 0660
    directory mask = 0770
    force create mode = 0660
    force directory mode = 0770
    follow symlinks = no
    wide links = no
    durable handles = no
    strict sync = yes
    sync always = yes
    ea support = yes
    vfs objects = catia fruit streams_xattr full_audit
    fruit:resource = file
    fruit:metadata = netatalk
    fruit:encoding = native
    fruit:locking = none
    fruit:posix_rename = yes
    fruit:veto_appledouble = yes
    fruit:zero_file_id = yes
    streams_xattr:prefix = user.DosStream.
    streams_xattr:store_stream_type = no
    full_audit:prefix = %u|%I|%S
    full_audit:success = connect disconnect mkdirat renameat unlinkat openat create_file close write pwrite fsync
    full_audit:failure = connect mkdirat renameat unlinkat openat create_file write pwrite
    full_audit:facility = LOCAL7
    full_audit:priority = NOTICE

[Shared]
    copy = Personal
    path = /srv/deniz-cloud/storage/shared
    available = no

[ApiBroker]
    # This is the only namespace path mounted into the API container. Routing
    # API/WebDAV through smbd puts all writers under Samba share-mode locking.
    path = /srv/deniz-cloud/storage
    read only = no
    browseable = no
    guest ok = no
    valid users = deniz-api-broker
    # Numeric on purpose: every existing storage file is 1000:1000, but gid 1000
    # is not the storage user's primary group on this host. Forcing the name
    # would write a gid no existing file uses.
    force user = 1000
    force group = 1000
    create mask = 0660
    directory mask = 0770
    force create mode = 0660
    force directory mode = 0770
    follow symlinks = no
    wide links = no
    durable handles = no
    strict sync = yes
    sync always = yes
    ea support = no
    vfs objects = full_audit
    hosts allow = 127.0.0.1
    hosts deny = ALL
    # Gate1B transitional boundary only. This principal has namespace-wide
    # reach so API request-to-account authorization must gate every operation.
    # It must not be presented as the Checkpoint 5 human-access cutover.
    full_audit:prefix = api-broker|127.0.0.1|%S
    full_audit:success = connect disconnect mkdirat renameat unlinkat openat create_file close write pwrite fsync
    full_audit:failure = connect mkdirat renameat unlinkat openat create_file write pwrite
    full_audit:facility = LOCAL7
    full_audit:priority = NOTICE
