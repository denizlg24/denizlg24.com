# Production-only broker boundary. Apply after docker-compose.pi.yml once the
# host pilot has mounted /srv/deniz-cloud/api-storage. Compose's !override tag
# is intentional: retaining even one base storage bind would bypass Samba.
services:
  api:
    environment:
      HDD_STORAGE_PATH: /data/capacity/hdd
      # Subdirectories of one mount, not four mounts. S3 publishes an object by
      # renaming it from the temp path onto its final path, and rename() across
      # two bind mounts is EXDEV even when both resolve to the same disk — so
      # separate mounts failed every upload. The rename has to stay a rename:
      # it is what makes a partially written object impossible to observe.
      S3_ROOT_PATH: /data/internal/.s3-v2
      S3_TEMP_PATH: /data/internal/.s3-v2-temp
      SSD_STORAGE_PATH: /data/capacity/ssd
      STORAGE_ARCHIVE_PATH: /data/internal/.archives
      STORAGE_NAMESPACE_MODE: broker-mounted
      STORAGE_NAMESPACE_PATH: /data/storage
      STORAGE_NAMESPACE_WITNESS_PATH: /data/storage/.denizcloud-mount-witness
      # The privileged metadata service. Without both of these the byte path
      # cannot verify identity and fails closed rather than serving unverified
      # entries.
      STORAGE_METADATA_SOCKET: /run/deniz-cloud/storage-metadata.sock
      STORAGE_METADATA_TOKEN: ${STORAGE_METADATA_TOKEN:?STORAGE_METADATA_TOKEN is required in broker mode}
      TEMP_UPLOAD_PATH: /data/internal/.tus-partial
    volumes: !override
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      # Empty, read-only directories expose statfs for quota/health without
      # exposing either private namespace branch.
      - /mnt/ssd/deniz-cloud/internal/.capacity:/data/capacity/ssd:ro
      - /mnt/hdd/deniz-cloud/internal/.capacity:/data/capacity/hdd:ro
      - /srv/deniz-cloud/internal/.capacity:/data/capacity/root:ro
      # Project S3 and request staging remain independent from Personal/Shared.
      # One mount, so the temp and final S3 paths share a filesystem and the
      # publish rename works; see S3_ROOT_PATH above.
      - /mnt/ssd/deniz-cloud/internal:/data/internal
      # This source is the encrypted loopback CIFS mount, not mergerfs.
      - /srv/deniz-cloud/api-storage:/data/storage
      # The runtime directory, not the socket file. Bind-mounting a socket pins
      # its inode, so restarting the metadata service leaves the container
      # holding a deleted socket and every download fails closed while the
      # service looks healthy. Mounting the directory lets a recreated socket
      # propagate. Still only the socket's home — never the namespace it fronts.
      - /run/deniz-cloud:/run/deniz-cloud
      - ${BACKUP_DIR:?BACKUP_DIR is required}:/backups
      - ${HOST_CONTROL_DIR:-/var/lib/deniz-cloud}:/host-control
