# Every holder of a DR host lock — backup, offsite sync and retention, the Forge
# deploy agent, a release workflow's SSH session, the Mac bridge's pull — dies
# with the boot that took it, so a lock that outlives a reboot is abandoned by
# definition. Nothing else can recognise one: the pid it names may belong to an
# unrelated process by now, and the workflow and Mac locks name no pid at all.
# A hard reset mid-backup used to leave exactly this behind.
#
# `!` confines both lines to `systemd-tmpfiles --boot`, which runs before
# sysinit.target — ahead of every service, timer and SSH session that could
# take a lock — and never on a later `--remove`, which would break live ones.
R! /var/lib/deniz-dr/locks/*.lock
R! /var/lib/deniz-dr/locks/*.lock.*
