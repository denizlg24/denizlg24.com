# The Pi runs daily where the template runs every six hours. Forge's snapshot is
# tens of megabytes and stays on the template cadence; the Pi's is a 73 GiB
# namespace archive, and the tar pass over it is the single heaviest thing this
# host does. Four of those a day existed only because the profiles shared a
# timer, not because the file tree changes that often.
#
# OnCalendar is a list, so it is cleared before being set or the template's four
# daily firings would remain alongside this one.
#
# 05:17 UTC keeps the archive clear of the two ops tasks that rewrite the
# namespace underneath it: namespace_checksum at 02:00 stamps checksum xattrs
# and namespace_tiering at 03:00 physically relocates files between disks.
# Either one landing mid-archive trips the backup's own consistency check
# ("Namespace changed while it was archived") and throws the whole run away.
[Timer]
OnCalendar=
OnCalendar=*-*-* 05:17:00 UTC
