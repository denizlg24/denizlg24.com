[DEFAULT]
# sshd is a host service and reaches INPUT, so the ufw action works for it.
# The database jails override this: their ports are Docker-published, so a ban
# written to INPUT never sees the packets. See action.d/deniz-docker-user.conf.
banaction = ufw
ignoreip = 127.0.0.1/8 ::1 100.64.0.0/10 192.168.1.0/24
bantime = 1h
findtime = 10m
maxretry = 6

[sshd]
enabled = true
backend = systemd
port = 22
maxretry = 5

[deniz-cloud-postgres]
enabled = true
backend = systemd
filter = deniz-cloud-postgres
banaction = deniz-docker-user
port = 5433

[deniz-cloud-mongodb]
enabled = true
backend = systemd
filter = deniz-cloud-mongodb
banaction = deniz-docker-user
port = 27018

[deniz-cloud-redis]
enabled = true
backend = systemd
filter = deniz-cloud-redis
banaction = deniz-docker-user
port = 6380,6381
