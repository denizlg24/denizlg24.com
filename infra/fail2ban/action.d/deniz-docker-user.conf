# Bans in the DOCKER-USER chain instead of INPUT.
#
# Traffic to a Docker-published port is DNAT'd in PREROUTING and traverses
# FORWARD, never INPUT. UFW and every stock fail2ban action write to INPUT, so a
# ban against the database ports is recorded and has no effect whatsoever — the
# packets still reach the container. DOCKER-USER is the chain Docker guarantees
# is evaluated before its own rules, and is the only correct place to drop this
# traffic.
#
# Host services (sshd) are unaffected by this and should keep using the ufw
# action, which is why this is opt-in per jail rather than a DEFAULT.

[Definition]

actionstart = <iptables> -N f2b-<name> 2>/dev/null || true
              <iptables> -A f2b-<name> -j RETURN
              <iptables> -I DOCKER-USER -j f2b-<name>

actionstop = <iptables> -D DOCKER-USER -j f2b-<name>
             <iptables> -F f2b-<name>
             <iptables> -X f2b-<name>

actioncheck = <iptables> -n -L DOCKER-USER | grep -q 'f2b-<name>[ \t]'

actionban = <iptables> -I f2b-<name> 1 -s <ip> -j DROP

actionunban = <iptables> -D f2b-<name> -s <ip> -j DROP

[Init]

iptables = iptables -w
name = default
