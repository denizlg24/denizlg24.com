# Drop-in for user-1001.slice (sandbox-runner), installed as
# /etc/systemd/system/user-1001.slice.d/agent-runner.conf.
#
# Every sprint run's container lands in a scope under this slice. A quarter of
# forge-apps.slice's 200, so under contention a deployment or a live app always
# wins over a coding run. Each run is additionally capped at four CPUs by its
# own container limit.
[Slice]
CPUWeight=50
