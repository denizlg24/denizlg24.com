# Forge (MSI Z370 GAMING PLUS) hangs after a clean shutdown: userspace stops in
# seconds, the journal closes, and the board never resets — every `sudo reboot`
# needed someone at the power button. systemd-shutdown arms the hardware
# watchdog with this timeout before handing the machine to the kernel, so a
# reset that never happens is forced by the chipset instead.
#
# This alone does nothing here. iTCO_wdt asks to be stopped by the kernel's
# reboot notifier, which runs before the firmware reset — the exact step that
# hangs — so the watchdog is disarmed right before it is needed.
# `watchdog.stop_on_reboot=0` on the kernel command line (90-forge.cfg) keeps
# it armed through that. The TCO timer tops out at 614 s; the default 10 min
# would not fit.
[Manager]
RebootWatchdogSec=3min
