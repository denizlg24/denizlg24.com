# Sourced by update-grub after /etc/default/grub; installed as
# /etc/default/grub.d/90-forge.cfg.
#
# watchdog.stop_on_reboot=0 keeps the reboot watchdog armed through the kernel's
# reboot notifier (see forge-watchdog.conf). The watchdog core is built in, so
# the command line is the only place this parameter can be set, and it applies
# when iTCO_wdt registers.
#
# reboot=pci resets through the chipset's CF9 register instead of the ACPI
# reset vector, the usual cure for a board that halts rather than resets. If it
# is not, the watchdog still is.
GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT} watchdog.stop_on_reboot=0 reboot=pci"
