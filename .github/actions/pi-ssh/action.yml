name: Configure Pi recovery SSH
description: Use an optional OpenSSH key when the recovered Pi host does not run Tailscale SSH.
inputs:
  private-key:
    description: Optional Pi deployment SSH private key.
    required: false
runs:
  using: composite
  steps:
    - shell: bash
      env:
        PI_SSH_PRIVATE_KEY: ${{ inputs.private-key }}
      run: |
        set -euo pipefail
        [[ -n "$PI_SSH_PRIVATE_KEY" ]] || exit 0
        umask 077
        mkdir -p "$HOME/.ssh"
        chmod 0700 "$HOME/.ssh"
        printf '%s\n' "$PI_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
        ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
