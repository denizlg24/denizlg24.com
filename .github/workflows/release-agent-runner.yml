name: Release agent runner

on:
  push:
    branches: [main]
    paths:
      - "apps/agent-runner/**"
      # The runtime image releases on its own workflow.
      - "!apps/agent-runner/runtime.Dockerfile"
      - "!apps/agent-runner/runtime/**"
      - "!apps/agent-runner/AGENTS.md"
      # The runner protocol and the stream mapper are compiled into the binary.
      - "packages/schemas/src/sprints.ts"
      - "packages/utils/src/claude-stream.ts"
      - "infra/systemd/agent-runner.service"
      - "infra/systemd/agent-runner-slice.conf"
      - ".github/workflows/release-agent-runner.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          validate exercises the whole path (tailnet, SSH, staging copy,
          checksum) but never installs the binary or restarts the service.
          deploy is the real thing.
        required: false
        default: deploy
        type: choice
        options: [deploy, validate]

concurrency:
  group: release-agent-runner-forge
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build the runner binary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck and test
        run: |
          bunx turbo typecheck --filter=agent-runner
          bunx turbo test --filter=agent-runner

      - name: Compile
        working-directory: apps/agent-runner
        run: |
          bun build src/index.ts --compile --target=bun-linux-x64 \
            --define "AGENT_RUNNER_BUILD_VERSION=\"${GITHUB_SHA}\"" \
            --outfile dist/agent-runner

      - name: Checksum
        run: |
          cd apps/agent-runner/dist
          sha256sum agent-runner > agent-runner.sha256
          cat agent-runner.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: agent-runner
          path: |
            apps/agent-runner/dist/agent-runner
            apps/agent-runner/dist/agent-runner.sha256
          retention-days: 14
          if-no-files-found: error

  deploy:
    name: Deploy to the forge host
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Manual approval gate, as for the deploy agent.
    environment: forge
    env:
      FORGE_HOST: ${{ vars.FORGE_TAILNET_HOST }}
      DEPLOY_MODE: ${{ inputs.mode || 'deploy' }}
    steps:
      - name: Check out service assets
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: agent-runner
          path: dist

      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Validate deployment settings
        run: |
          test -n "$FORGE_HOST"
          [[ "$FORGE_HOST" =~ ^[A-Za-z0-9.-]+$ ]]

      - name: Resolve the host on the tailnet
        run: |
          # tailscale/github-action leaves --accept-dns=false so MagicDNS names
          # never resolve here; tailscaled answers from the netmap instead.
          if ! FORGE_ADDR="$(tailscale ip -4 "$FORGE_HOST")"; then
            tailscale status --peers >&2
            exit 1
          fi
          [[ "$FORGE_ADDR" =~ ^100\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "FORGE_ADDR=$FORGE_ADDR" >> "$GITHUB_ENV"

      - name: Stage the binary and its units
        run: |
          scp \
            -o StrictHostKeyChecking=accept-new \
            -o BatchMode=yes \
            dist/agent-runner \
            infra/systemd/agent-runner.service \
            infra/systemd/agent-runner-slice.conf \
            "denizlg24@${FORGE_ADDR}:/var/lib/forge-agent/staging/"

      - name: Verify the staged checksum
        run: |
          expected="$(cut -d' ' -f1 dist/agent-runner.sha256)"
          actual="$(ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            "denizlg24@${FORGE_ADDR}" \
            "sha256sum /var/lib/forge-agent/staging/agent-runner | cut -d' ' -f1")"
          echo "expected $expected"
          echo "actual   $actual"
          [ "$expected" = "$actual" ]

      # Restarting the runner never stops a run: its containers belong to the
      # sandbox daemon and the new process re-attaches to them on boot.
      - name: Install and restart
        if: env.DEPLOY_MODE == 'deploy'
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            "denizlg24@${FORGE_ADDR}" \
            "sudo /usr/local/sbin/forge-agent-install --install-agent-runner"

      - name: Verify the installed version
        if: env.DEPLOY_MODE == 'deploy'
        run: |
          installed="$(ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            "denizlg24@${FORGE_ADDR}" "/usr/local/bin/agent-runner --version")"
          echo "installed $installed"
          [ "$installed" = "$GITHUB_SHA" ]
          ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            "denizlg24@${FORGE_ADDR}" \
            "if systemctl is-enabled --quiet agent-runner; then systemctl is-active agent-runner; else echo 'agent-runner not enabled yet'; fi"

      - name: Clean up staging after a validate run
        if: env.DEPLOY_MODE != 'deploy'
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            "denizlg24@${FORGE_ADDR}" \
            "rm -f /var/lib/forge-agent/staging/agent-runner /var/lib/forge-agent/staging/agent-runner.service /var/lib/forge-agent/staging/agent-runner-slice.conf"
          {
            echo "### Validate-only run"
            echo
            echo "Tailnet, SSH, staging copy and checksum all succeeded."
            echo "Nothing was installed and the service was not restarted."
          } >> "$GITHUB_STEP_SUMMARY"
