name: Release Macros iOS

# Builds an unsigned IPA of apps/macros-mobile for every pull request that
# touches it, and publishes one when the app's package.json version changes on
# main. SideStore re-signs the IPA on the device with the user's own Apple ID,
# so nothing here holds a certificate or provisioning profile.
#
# Publishing produces two things:
# - a `macros-ios-v<version>` release carrying the IPA and its metadata JSON;
# - `source.json` on the rolling `macros-ios-source` release, regenerated from
#   every published version. That is the URL SideStore subscribes to (proxied
#   at https://macros.denizlg24.com/ios/source.json).

on:
  push:
    branches: ["main"]
    paths:
      - "apps/macros-mobile/**"
      - "packages/macros-core/**"
      - "packages/schemas/src/macros/**"
      - "bun.lock"
      - ".github/workflows/release-macros-ios.yml"
  pull_request:
    paths:
      - "apps/macros-mobile/**"
      - "packages/macros-core/**"
      - "packages/schemas/src/macros/**"
      - "bun.lock"
      - ".github/workflows/release-macros-ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-macros-ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    name: Detect release
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect version change
        id: version
        shell: bash
        run: |
          current_version="$(jq -r '.version' apps/macros-mobile/package.json)"
          echo "version=$current_version" >> "$GITHUB_OUTPUT"
          echo "tag=macros-ios-v$current_version" >> "$GITHUB_OUTPUT"

          # SideStore detects updates by version alone, so a version that was
          # already published must never be published again with new bytes.
          already_published=false
          if git ls-remote --exit-code --tags origin "refs/tags/macros-ios-v$current_version" >/dev/null; then
            already_published=true
          fi

          case "${{ github.event_name }}" in
            pull_request)
              echo "publish=false" >> "$GITHUB_OUTPUT"
              ;;
            workflow_dispatch)
              if [[ "${{ github.ref }}" != "refs/heads/main" || "$already_published" == "true" ]]; then
                echo "::notice::Building $current_version without publishing."
                echo "publish=false" >> "$GITHUB_OUTPUT"
              else
                echo "publish=true" >> "$GITHUB_OUTPUT"
              fi
              ;;
            push)
              previous_version="$(
                git show "${{ github.event.before }}:apps/macros-mobile/package.json" 2>/dev/null |
                  jq -r '.version' ||
                  true
              )"
              if [[ "$current_version" == "$previous_version" ]]; then
                echo "publish=false" >> "$GITHUB_OUTPUT"
              elif [[ "$already_published" == "true" ]]; then
                echo "::error::macros-ios-v$current_version already exists. Bump apps/macros-mobile/package.json."
                exit 1
              else
                echo "publish=true" >> "$GITHUB_OUTPUT"
              fi
              ;;
          esac

  build:
    name: Build unsigned IPA
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 60
    env:
      MACROS_IOS_BUILD_NUMBER: ${{ github.run_number }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
    defaults:
      run:
        working-directory: apps/macros-mobile
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Xcode's "Bundle React Native code and images" phase runs the Expo CLI
      # under node, so the runner needs a node React Native 0.86 accepts.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Test shared domain logic
        working-directory: packages/macros-core
        run: bun test

      - name: Generate the native project
        run: bunx expo prebuild --platform ios --clean

      - name: Archive
        shell: bash
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace ios/Macros.xcworkspace \
            -scheme Macros \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Macros.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            | tee "$RUNNER_TEMP/xcodebuild.log" \
            | xcbeautify --renderer github-actions

      - name: Package IPA
        shell: bash
        run: |
          app="$RUNNER_TEMP/Macros.xcarchive/Products/Applications/Macros.app"
          if [[ ! -d "$app" ]]; then
            echo "::error::The archive holds no Macros.app"
            exit 1
          fi
          mkdir -p build/Payload
          cp -R "$app" build/Payload/
          (cd build && zip -qry "Macros-$VERSION.ipa" Payload)
          ls -l build

      - name: Write release notes
        shell: bash
        run: |
          previous_tag="$(
            git tag --list 'macros-ios-v*' --sort=-v:refname |
              grep -Fvx "$TAG" |
              head -n 1 ||
              true
          )"
          if [[ -n "$previous_tag" ]]; then
            git log --format='- %s' "$previous_tag..HEAD" -- . ../../packages/macros-core > build/release-notes.md
          else
            git log --format='- %s' -n 30 HEAD -- . > build/release-notes.md
          fi
          if [[ ! -s build/release-notes.md ]]; then
            echo "- Maintenance release." > build/release-notes.md
          fi
          cat build/release-notes.md

      - name: Describe the build for SideStore
        run: >
          bun scripts/release-metadata.ts
          --app build/Payload/Macros.app
          --ipa "build/Macros-$VERSION.ipa"
          --entitlements ios/Macros/Macros.entitlements
          --download-url "https://github.com/${{ github.repository }}/releases/download/$TAG/Macros-$VERSION.ipa"
          --notes build/release-notes.md
          --out "build/macros-ios-$VERSION.json"

      # A free Apple account, which is what most SideStore users sign with,
      # cannot grant push, App Groups, HealthKit, associated domains or iCloud.
      # An IPA that asks for any of them fails to install for those users.
      - name: Refuse entitlements a free account cannot sign
        shell: bash
        run: |
          entitlements="$(jq -r '.entitlements | join(", ")' "build/macros-ios-$VERSION.json")"
          if [[ -n "$entitlements" ]]; then
            echo "::error::The IPA requests entitlements: $entitlements"
            exit 1
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: macros-ios-${{ needs.prepare.outputs.version }}
          path: |
            apps/macros-mobile/build/*.ipa
            apps/macros-mobile/build/*.json
            apps/macros-mobile/build/release-notes.md
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macros-ios-xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish to SideStore
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: macros-ios-${{ needs.prepare.outputs.version }}
          path: dist

      # Never "latest": the Envoy CLI's updater reads this repository's
      # releases, and the repository's latest release must stay an Envoy one.
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Macros iOS v${{ needs.prepare.outputs.version }}
          body_path: dist/release-notes.md
          make_latest: false
          files: |
            dist/Macros-${{ needs.prepare.outputs.version }}.ipa
            dist/macros-ios-${{ needs.prepare.outputs.version }}.json

      - name: Compose the SideStore source
        shell: bash
        run: |
          mkdir -p sources
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName \
            --jq '.[].tagName | select(startswith("macros-ios-v"))' > tags.txt
          while read -r tag; do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --pattern 'macros-ios-*.json' --dir sources --clobber || true
          done < tags.txt
          # The listing API can lag the release just created.
          cp "dist/macros-ios-$VERSION.json" sources/
          bun apps/macros-mobile/scripts/compose-source.ts --releases sources --out source.json

      - name: Publish the source
        shell: bash
        run: |
          if ! gh release view macros-ios-source --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create macros-ios-source \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Macros iOS — SideStore source" \
              --notes "The SideStore/AltStore source for Macros. Add https://macros.denizlg24.com/ios/source.json in SideStore; this release only hosts the file." \
              --prerelease \
              --latest=false
          fi
          gh release upload macros-ios-source source.json --repo "$GITHUB_REPOSITORY" --clobber
