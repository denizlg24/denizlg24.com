name: Release markets relay

on:
  push:
    branches: [main]
    paths:
      - "apps/markets-relay/**"
      - "packages/markets/**"
      - "infra/compose/docker-compose.markets.yml"
      - ".github/workflows/release-markets-relay.yml"
      - "bun.lock"
      - "package.json"
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing immutable relay tag to deploy (blank deploys this commit)
        required: false
        type: string
      mode:
        description: >-
          validate exercises the whole deploy path (tailnet, SSH, asset copy,
          GHCR pull, compose render against the real .env.markets) but never
          starts a container. deploy is the real thing.
        required: false
        default: deploy
        type: choice
        options: [deploy, validate]

concurrency:
  group: release-markets-relay-pi
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELAY_IMAGE: ghcr.io/denizlg24/markets-relay

jobs:
  build:
    name: Build and push multi-architecture relay image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Publishing the relay image to GHCR. `deploy` only checks out the
      # compose file and does not need it.
      packages: write
    outputs:
      image_tag: ${{ steps.release.outputs.image_tag }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Log in to GHCR
        if: github.event_name != 'workflow_dispatch' || inputs.image_tag == ''
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set release metadata
        id: release
        env:
          REQUESTED_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ -n "$REQUESTED_TAG" ]]; then
            if [[ ! "$REQUESTED_TAG" =~ ^[0-9a-f]{40}$ ]]; then
              echo "image_tag must be a full Git SHA" >&2
              exit 1
            fi
            echo "image_tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: github.event_name != 'workflow_dispatch' || inputs.image_tag == ''
        uses: docker/setup-buildx-action@v4

      - name: Set up QEMU
        if: github.event_name != 'workflow_dispatch' || inputs.image_tag == ''
        uses: docker/setup-qemu-action@v4

      - name: Build and push
        if: github.event_name != 'workflow_dispatch' || inputs.image_tag == ''
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/markets-relay/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.RELAY_IMAGE }}:${{ github.sha }}
            ${{ env.RELAY_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Verify both release platforms
        if: github.event_name != 'workflow_dispatch' || inputs.image_tag == ''
        run: |
          docker buildx imagetools inspect "${RELAY_IMAGE}:${GITHUB_SHA}" --raw > manifest.json
          jq -e '[.manifests[].platform | select(.os == "linux") | (.os + "/" + .architecture)] | unique | sort == ["linux/amd64", "linux/arm64"]' manifest.json

      - name: Boot and health-check both release platforms
        if: github.event_name != 'workflow_dispatch' || inputs.image_tag == ''
        run: |
          set -Eeuo pipefail
          for architecture in amd64 arm64; do
            name="markets-relay-${architecture}"
            docker run --detach --name "$name" --platform "linux/${architecture}" --publish 33004:3004 \
              --env TIINGO_API_KEY=ci-placeholder --env MARKETS_RELAY_TOKEN_SECRET=ci-only-relay-secret \
              "${RELAY_IMAGE}:${GITHUB_SHA}"
            healthy=false
            for _ in $(seq 1 60); do
              if curl --fail --silent http://127.0.0.1:33004/healthz | jq -e '.status == "ok"' >/dev/null; then
                healthy=true
                break
              fi
              sleep 1
            done
            if [[ "$healthy" != true ]]; then
              docker logs "$name"
              exit 1
            fi
            docker rm --force "$name"
          done

  deploy:
    name: Deploy to Pi
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pi
    env:
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
      PI_HOST: ${{ vars.PI_TAILNET_HOST }}
      DEPLOY_MODE: ${{ inputs.mode || 'deploy' }}
    steps:
      - name: Check out deployment assets
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Validate deployment settings
        run: |
          test -n "$PI_HOST"
          test -n "$IMAGE_TAG"
          [[ "$PI_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]

      - name: Resolve the Pi on the tailnet
        run: |
          # tailscale/github-action leaves --accept-dns=false so MagicDNS names
          # never resolve here; tailscaled answers from the netmap instead.
          if ! PI_ADDR="$(tailscale ip -4 "$PI_HOST")"; then
            tailscale status --peers >&2
            exit 1
          fi
          [[ "$PI_ADDR" =~ ^100\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "PI_ADDR=$PI_ADDR" >> "$GITHUB_ENV"

      - name: Fence the Pi backup snapshot
        run: |
          lock_token="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-markets"
          [[ "$lock_token" =~ ^[0-9]+-[0-9]+-markets$ ]]
          ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes "denizlg24@${PI_ADDR}" \
            "set -e; lease=\$(dig @1.1.1.1 +short TXT _active-site-pi.denizlg24.com | tr -d '\"' | head -1); test \"\$lease\" = home; lock=/var/lib/deniz-dr/locks/pi-cloud.lock; mkdir \"\$lock\"; printf '%s\\n' '$lock_token' > \"\$lock/owner\""
          echo "DR_DEPLOY_LOCK_TOKEN=$lock_token" >> "$GITHUB_ENV"

      - name: Copy the compose file
        run: |
          scp \
            -o StrictHostKeyChecking=accept-new \
            -o BatchMode=yes \
            infra/compose/docker-compose.markets.yml \
            "denizlg24@${PI_ADDR}:/tmp/docker-compose.markets.yml"
          ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes "denizlg24@${PI_ADDR}" \
            "mkdir -p /opt/markets-relay && mv /tmp/docker-compose.markets.yml /opt/markets-relay/docker-compose.markets.yml"

      # Renders against the real .env.markets on the Pi, proving the env file is
      # present and complete without starting anything.
      - name: Validate compose on the Pi
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes "denizlg24@${PI_ADDR}" \
            "cd /opt/markets-relay && test -f .env.markets && MARKETS_RELAY_IMAGE='${RELAY_IMAGE}:${IMAGE_TAG}' MARKETS_RELAY_VERSION='${IMAGE_TAG}' docker compose --env-file .env.markets -f docker-compose.markets.yml config -q"

      - name: Pull the image
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes "denizlg24@${PI_ADDR}" \
            "cd /opt/markets-relay && MARKETS_RELAY_IMAGE='${RELAY_IMAGE}:${IMAGE_TAG}' MARKETS_RELAY_VERSION='${IMAGE_TAG}' docker compose --env-file .env.markets -f docker-compose.markets.yml pull"

      - name: Start the relay
        if: env.DEPLOY_MODE == 'deploy'
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes "denizlg24@${PI_ADDR}" \
            "cd /opt/markets-relay && MARKETS_RELAY_IMAGE='${RELAY_IMAGE}:${IMAGE_TAG}' MARKETS_RELAY_VERSION='${IMAGE_TAG}' docker compose --env-file .env.markets -f docker-compose.markets.yml up -d"

      - name: Record validate-only run
        if: env.DEPLOY_MODE != 'deploy'
        run: |
          {
            echo "### Validate-only run"
            echo
            echo "Tailnet, SSH, asset copy, GHCR pull and compose render all"
            echo "succeeded against the Pi. No container was started."
            echo
            echo "- image: \`${RELAY_IMAGE}:${IMAGE_TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Health gate
        if: env.DEPLOY_MODE == 'deploy'
        run: |
          for _ in {1..20}; do
            response="$(curl --fail --silent --show-error https://markets-ws.denizlg24.com/healthz || true)"
            if jq -e --arg version "$IMAGE_TAG" \
              '.status == "ok" and .version == $version' <<< "$response" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "Relay did not report version ${IMAGE_TAG}" >&2
          exit 1

      - name: Release the Pi backup fence
        if: always() && env.DR_DEPLOY_LOCK_TOKEN != ''
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes "denizlg24@${PI_ADDR}" \
            "set -e; lock=/var/lib/deniz-dr/locks/pi-cloud.lock; test \"\$(cat \"\$lock/owner\" 2>/dev/null)\" = '$DR_DEPLOY_LOCK_TOKEN'; rm -f \"\$lock/owner\"; rmdir \"\$lock\""
