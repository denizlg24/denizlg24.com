name: Sync Envoy CLI release mirror

on:
  push:
    branches: ["main"]
    paths:
      - "apps/envoy-cli/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-envoy-cli
  cancel-in-progress: false

jobs:
  sync:
    name: Push subtree
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Split Envoy CLI history
        run: git subtree split --prefix=apps/envoy-cli --branch envoy-cli-sync

      - name: Push release mirror
        env:
          ENVOY_REPO_TOKEN: ${{ secrets.ENVOY_REPO_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$ENVOY_REPO_TOKEN" ]]; then
            echo "ENVOY_REPO_TOKEN is required." >&2
            exit 1
          fi

          auth_header="$(printf 'x-access-token:%s' "$ENVOY_REPO_TOKEN" | base64 -w 0)"
          echo "::add-mask::$auth_header"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" \
            push https://github.com/denizlg24/envoy.git \
            envoy-cli-sync:master
