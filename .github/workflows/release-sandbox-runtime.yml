name: Release agent sandbox runtime

on:
  push:
    branches: [main]
    paths:
      - "apps/sandbox/runtime/**"
      - "apps/sandbox/runtime.Dockerfile"
      - ".github/workflows/build-image.yml"
      - ".github/workflows/release-sandbox-runtime.yml"
  workflow_dispatch:

concurrency:
  group: release-sandbox-runtime
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and verify sandbox runtime
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write
    with:
      image: ghcr.io/denizlg24/agent-sandbox-runtime
      dockerfile: apps/sandbox/runtime.Dockerfile
      smoke_command: bun --version && python3 --version && test -x /usr/local/bin/sandbox-file && test -x /usr/local/bin/sandbox-http
