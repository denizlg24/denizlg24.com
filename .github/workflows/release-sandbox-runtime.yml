name: Release agent sandbox runtime

on:
  push:
    branches: [main]
    paths:
      - "apps/sandbox/runtime/**"
      - "apps/sandbox/runtime.Dockerfile"
      - ".github/workflows/release-sandbox-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  RUNTIME_IMAGE: ghcr.io/denizlg24/agent-sandbox-runtime

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/sandbox/runtime.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.RUNTIME_IMAGE }}:${{ github.sha }}
            ${{ env.RUNTIME_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
