name: Release Envoy CLI

on:
  push:
    branches: ["main"]
    paths:
      - "apps/envoy-cli/Cargo.toml"
      - ".github/workflows/release-envoy-cli.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-envoy-cli
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect version change
        id: version
        shell: bash
        run: |
          current_version="$(
            cargo metadata \
              --no-deps \
              --format-version 1 \
              --manifest-path apps/envoy-cli/Cargo.toml |
              jq -r '.packages[] | select(.name == "envoy-cli") | .version'
          )"

          if [[ "${{ github.event_name }}" != "push" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "tag=envoy-v$current_version" >> "$GITHUB_OUTPUT"
            echo "version=$current_version" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous_version="$(
            git show "${{ github.event.before }}:apps/envoy-cli/Cargo.toml" 2>/dev/null |
              sed -nE 's/^version = "([^"]+)"/\1/p' |
              head -n 1
          )"

          if [[ "$current_version" == "$previous_version" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The release workflow changed, but the CLI version did not."
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "tag=envoy-v$current_version" >> "$GITHUB_OUTPUT"
          echo "version=$current_version" >> "$GITHUB_OUTPUT"

  test:
    name: Verify release
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    env:
      ENVOY_NO_UPDATE_CHECK: "1"
    defaults:
      run:
        working-directory: apps/envoy-cli
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/envoy-cli -> target"

      - run: cargo fmt --check
      - run: cargo test --all-targets --locked
      - run: cargo clippy --all-targets --locked -- -D warnings

  build:
    name: Build ${{ matrix.target }}
    needs: [prepare, test]
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: envy
            archive: envoy-x86_64-unknown-linux-gnu.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: envy
            archive: envoy-x86_64-unknown-linux-musl.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: envy
            archive: envoy-aarch64-unknown-linux-gnu.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: envy
            archive: envoy-x86_64-apple-darwin.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: envy
            archive: envoy-aarch64-apple-darwin.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: envy.exe
            archive: envoy-x86_64-pc-windows-msvc.zip
    defaults:
      run:
        working-directory: apps/envoy-cli
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/envoy-cli -> target"
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        if: runner.os != 'Windows'
        shell: bash
        run: tar -C "target/${{ matrix.target }}/release" -czf "${{ matrix.archive }}" "${{ matrix.binary }}"

      - name: Package
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.binary }}" -DestinationPath "${{ matrix.archive }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: apps/envoy-cli/${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: [prepare, build]
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Build Envoy CLI release notes
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          previous_tag="$(
            git tag --list 'envoy-v*' --sort=-v:refname |
              grep -Fvx "$TAG" |
              head -n 1 ||
              true
          )"

          if [[ -n "$previous_tag" ]]; then
            changes="$(git log --format='- %s (`%h`)' "$previous_tag..HEAD" -- apps/envoy-cli)"
          else
            changes="$(git log --format='- %s (`%h`)' HEAD -- apps/envoy-cli)"
          fi

          if [[ -z "$changes" ]]; then
            changes="- Release metadata only."
          fi

          {
            echo "## Envoy CLI v$VERSION"
            echo
            echo "$changes"
            echo
            echo "Source: https://github.com/${{ github.repository }}/tree/$TAG/apps/envoy-cli"
          } > envoy-release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Envoy CLI v${{ needs.prepare.outputs.version }}
          body_path: envoy-release-notes.md
          make_latest: false
          files: artifacts/**/*
