name: Release desktop app

on:
  push:
    branches: ["main"]
    paths:
      - "apps/desktop/src-tauri/tauri.conf.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect version change
        id: version
        shell: bash
        run: |
          current_version="$(jq -r '.version' apps/desktop/src-tauri/tauri.conf.json)"

          # Manual runs always release the current version; no diff to compare.
          if [[ "${{ github.event_name }}" != "push" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "tag=v$current_version" >> "$GITHUB_OUTPUT"
            echo "version=$current_version" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous_version="$(git show "${{ github.event.before }}:apps/desktop/src-tauri/tauri.conf.json" 2>/dev/null | jq -r '.version' 2>/dev/null || true)"

          if [[ "$current_version" == "$previous_version" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The Tauri configuration changed, but its version did not."
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "tag=v$current_version" >> "$GITHUB_OUTPUT"
          echo "version=$current_version" >> "$GITHUB_OUTPUT"

      - name: Install Bun
        if: steps.version.outputs.changed == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"

      # Not --generate-notes: that lists every PR merged into the monorepo.
      # The body is the CHANGELOG.md entry plus the PRs that touched what the
      # desktop app ships: itself, the web app it talks to, and the shared
      # packages it bundles.
      - name: Write release notes
        if: steps.version.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          bun scripts/ci/release-notes.ts \
            --version "$VERSION" \
            --tag-prefix v \
            --changelog apps/desktop/CHANGELOG.md \
            --paths apps/desktop,apps/web,packages/admin,packages/ui,packages/tts,packages/whiteboard-render \
            --head "${{ github.sha }}" \
            --repo "${{ github.repository }}" > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Create draft release and tag
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            is_draft="$(gh release view "$TAG" --json isDraft --jq '.isDraft')"
            if [[ "$is_draft" != "true" ]]; then
              echo "Release $TAG already exists and is published." >&2
              exit 1
            fi

            echo "Reusing existing draft release $TAG."
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
            exit 0
          fi

          gh release create "$TAG" \
            --draft \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --target "${{ github.sha }}" \
            --title "Desktop v$VERSION"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            platform: ubuntu-22.04
            args: ""
            rust_targets: ""
          - name: Windows x64
            platform: windows-latest
            args: ""
            rust_targets: ""
          - name: macOS Apple Silicon
            platform: macos-26
            args: "--target aarch64-apple-darwin"
            rust_targets: "aarch64-apple-darwin"
          - name: macOS Intel
            platform: macos-26-intel
            args: "--target x86_64-apple-darwin"
            rust_targets: "x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    # Holds the Developer ID certificate and the App Store Connect key that
    # notarizes with. No reviewers: the release is already gated on a version
    # bump on main, the environment only keeps the secrets off other workflows.
    environment: desktop-release
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Tauri signs and notarizes when these variables exist, and refuses an
      # empty APPLE_CERTIFICATE rather than skipping it, so they are exported
      # only when every secret is present. Without them the build falls back
      # to the ad-hoc identity it always had: it runs, but Gatekeeper refuses
      # it on first launch.
      - name: Prepare macOS signing
        id: macos-signing
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        env:
          DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          DEVELOPER_ID_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_IDENTITY }}
          APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          APPLE_ASC_PRIVATE_KEY: ${{ secrets.APPLE_ASC_PRIVATE_KEY }}
        run: |
          missing=()
          for name in DEVELOPER_ID_P12 DEVELOPER_ID_P12_PASSWORD DEVELOPER_ID_IDENTITY \
            APPLE_ASC_KEY_ID APPLE_ASC_ISSUER_ID APPLE_ASC_PRIVATE_KEY; do
            [[ -z "${!name}" ]] && missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::warning::Developer ID signing is not set up (missing: ${missing[*]}). Signing ad hoc."
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          key_path="$RUNNER_TEMP/AuthKey_$APPLE_ASC_KEY_ID.p8"
          printf '%s\n' "$APPLE_ASC_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          {
            echo "APPLE_CERTIFICATE=$DEVELOPER_ID_P12"
            echo "APPLE_CERTIFICATE_PASSWORD=$DEVELOPER_ID_P12_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$DEVELOPER_ID_IDENTITY"
            echo "APPLE_API_KEY=$APPLE_ASC_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_ASC_ISSUER_ID"
            echo "APPLE_API_KEY_PATH=$key_path"
          } >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: apps/desktop
          tauriScript: bunx tauri
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          releaseAssetNamePattern: "[name]_[version]_[platform]_[arch][setup][ext]"

      # What a downloaded copy will meet: Gatekeeper's assessment needs both
      # the Developer ID signature and a stapled notarization ticket.
      - name: Verify signature and notarization
        if: steps.macos-signing.outputs.signed == 'true'
        shell: bash
        run: |
          app="$(find apps/desktop/src-tauri/target -maxdepth 6 -type d -path '*/release/bundle/macos/*.app' | head -n 1)"
          if [[ -z "$app" ]]; then
            echo "No app bundle was built." >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E '^(Authority|TeamIdentifier|flags)='
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"

      - name: Remove signing material
        if: always() && startsWith(matrix.platform, 'macos-')
        shell: bash
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8

  publish:
    name: Publish release
    needs: [prepare, build]
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --latest
