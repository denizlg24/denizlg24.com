name: Tally (macOS)

# Pull requests build and test Tally unsigned, with no secret in reach. A
# version change in apps/tally-macos/project.yml on main (`bun run bump:tally`)
# releases it: Developer ID signed, notarized, stapled, on a `tally-v*` release
# that is never marked latest — the Envoy CLI's updater reads this
# repository's latest release.

on:
  pull_request:
    paths:
      - "apps/tally-macos/**"
      - ".github/workflows/release-tally.yml"
  push:
    branches: ["main"]
    paths:
      - "apps/tally-macos/project.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tally-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  APP_DIR: apps/tally-macos

jobs:
  verify:
    name: Build and test (unsigned)
    if: github.event_name == 'pull_request'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate the project
        working-directory: ${{ env.APP_DIR }}
        run: |
          brew install xcodegen
          xcodegen generate

      # Ad hoc: tests need a signed host app, and nothing here may hold a team
      # identity.
      - name: Test
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -o pipefail
          xcodebuild test \
            -project Tally.xcodeproj \
            -scheme Tally \
            -destination "platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM="" \
            | tee "$RUNNER_TEMP/xcodebuild.log" \
            | xcbeautify --renderer github-actions

      # The App Intents metadata is what a plain compile never checks.
      - name: Check the bundle
        shell: bash
        run: |
          app="$RUNNER_TEMP/dd/Build/Products/Debug/Tally.app"
          test -d "$app/Contents/Resources/Metadata.appintents"
          /usr/libexec/PlistBuddy -c "Print :LSUIElement" "$app/Contents/Info.plist"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tally-xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

  prepare:
    name: Prepare release
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect version change
        id: version
        shell: bash
        run: |
          read_version() {
            sed -nE 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"([0-9.]+)".*/\1/p' | head -n 1
          }
          current_version="$(read_version < "$APP_DIR/project.yml")"
          if [[ -z "$current_version" ]]; then
            echo "No MARKETING_VERSION in $APP_DIR/project.yml" >&2
            exit 1
          fi

          if [[ "${{ github.event_name }}" == "push" ]]; then
            previous_version="$(git show "${{ github.event.before }}:$APP_DIR/project.yml" 2>/dev/null | read_version || true)"
            if [[ "$current_version" == "$previous_version" ]]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "project.yml changed, but its version did not."
              exit 0
            fi
          fi

          {
            echo "changed=true"
            echo "tag=tally-v$current_version"
            echo "version=$current_version"
          } >> "$GITHUB_OUTPUT"

      - name: Install Bun
        if: steps.version.outputs.changed == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"

      # Not --generate-notes: that lists every PR merged into the monorepo.
      - name: Write release notes
        if: steps.version.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          bun scripts/ci/release-notes.ts \
            --version "$VERSION" \
            --tag-prefix tally-v \
            --changelog "$APP_DIR/CHANGELOG.md" \
            --paths "$APP_DIR" \
            --head "${{ github.sha }}" \
            --repo "${{ github.repository }}" > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Create draft release and tag
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            is_draft="$(gh release view "$TAG" --json isDraft --jq '.isDraft')"
            if [[ "$is_draft" != "true" ]]; then
              echo "Release $TAG already exists and is published." >&2
              exit 1
            fi
            echo "Reusing existing draft release $TAG."
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
            exit 0
          fi

          gh release create "$TAG" \
            --draft \
            --latest=false \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --target "${{ github.sha }}" \
            --title "Tally v$VERSION"

  build:
    name: Sign, notarize and upload
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
    # The Developer ID certificate and the App Store Connect key that
    # notarizes, shared with the desktop app's release.
    environment: desktop-release
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Unlike the desktop release there is no ad hoc fallback: an unsigned
      # menu-bar app that edits another tool's keychain item is not something
      # to hand Gatekeeper, so a missing secret fails the release.
      - name: Import signing material
        env:
          DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          DEVELOPER_ID_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_IDENTITY }}
          APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          APPLE_ASC_PRIVATE_KEY: ${{ secrets.APPLE_ASC_PRIVATE_KEY }}
        shell: bash
        run: |
          missing=()
          for name in DEVELOPER_ID_P12 DEVELOPER_ID_P12_PASSWORD DEVELOPER_ID_IDENTITY \
            APPLE_ASC_KEY_ID APPLE_ASC_ISSUER_ID APPLE_ASC_PRIVATE_KEY; do
            [[ -z "${!name}" ]] && missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Developer ID signing is not set up (missing: ${missing[*]})."
            exit 1
          fi

          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" \
            -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          existing=()
          while IFS= read -r line; do
            existing+=("$(echo "$line" | tr -d '" ')")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing[@]}"

          key_path="$RUNNER_TEMP/AuthKey_$APPLE_ASC_KEY_ID.p8"
          printf '%s\n' "$APPLE_ASC_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          {
            echo "SIGNING_KEYCHAIN=$keychain"
            echo "SIGNING_IDENTITY=$DEVELOPER_ID_IDENTITY"
            echo "ASC_KEY_PATH=$key_path"
            echo "ASC_KEY_ID=$APPLE_ASC_KEY_ID"
            echo "ASC_ISSUER_ID=$APPLE_ASC_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Generate the project
        working-directory: ${{ env.APP_DIR }}
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archive
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Tally.xcodeproj \
            -scheme Tally \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "$RUNNER_TEMP/Tally.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            OTHER_CODE_SIGN_FLAGS="--keychain $SIGNING_KEYCHAIN --timestamp" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            | tee "$RUNNER_TEMP/xcodebuild.log" \
            | xcbeautify --renderer github-actions

      - name: Export
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>developer-id</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Developer ID Application</string>
            <key>teamID</key><string>L6U3NB38AN</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Tally.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Notarize and staple
        shell: bash
        run: |
          app="$RUNNER_TEMP/export/Tally.app"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$ASC_KEY_PATH" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
            --wait --timeout 30m --output-format json | tee "$RUNNER_TEMP/notary.json"
          status="$(jq -r '.status' "$RUNNER_TEMP/notary.json")"
          if [[ "$status" != "Accepted" ]]; then
            id="$(jq -r '.id' "$RUNNER_TEMP/notary.json")"
            xcrun notarytool log "$id" \
              --key "$ASC_KEY_PATH" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" || true
            exit 1
          fi
          xcrun stapler staple "$app"

      # What a downloaded copy will meet: Gatekeeper needs the Developer ID
      # signature, the hardened runtime and a stapled ticket.
      - name: Verify
        shell: bash
        run: |
          app="$RUNNER_TEMP/export/Tally.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E '^(Authority|TeamIdentifier|flags)='
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          asset="$RUNNER_TEMP/Tally-$VERSION.zip"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/export/Tally.app" "$asset"
          shasum -a 256 "$asset" | tee "$asset.sha256"
          gh release upload "$TAG" "$asset" "$asset.sha256" --clobber

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tally-release-xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8
          if [[ -n "${SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi

  publish:
    name: Publish release
    needs: [prepare, build]
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --latest=false
