name: Macros scheduled recompute

on:
  schedule:
    # The endpoint resolves each user's local date and check-in weekday.
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: macros-scheduled-recompute
  cancel-in-progress: false

jobs:
  recompute:
    runs-on: ubuntu-latest
    steps:
      - name: Recompute weight trends and expenditure
        env:
          CRON_SECRET: ${{ secrets.MACROS_CRON_SECRET }}
        run: >-
          curl --fail --show-error --silent --retry 2
          --request POST
          --header "Authorization: Bearer ${CRON_SECRET}"
          https://macros.denizlg24.com/api/cron/recompute-weight-trends

      - name: Issue due weekly targets
        env:
          CRON_SECRET: ${{ secrets.MACROS_CRON_SECRET }}
        run: >-
          curl --fail --show-error --silent --retry 2
          --request POST
          --header "Authorization: Bearer ${CRON_SECRET}"
          https://macros.denizlg24.com/api/cron/issue-weekly-targets
