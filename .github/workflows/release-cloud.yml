name: Release cloud API

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/cloud-core/**"
      - "packages/schemas/**"
      - "infra/**"
      - ".github/workflows/release-cloud.yml"
      - "bun.lock"
      - "package.json"
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing immutable API tag to deploy (blank deploys this commit)
        required: false
        type: string
      mode:
        description: >-
          validate exercises the whole deploy path (tailnet, SSH, asset copy,
          GHCR pull, compose render against the real .env.pi) but never starts
          a container. Use it to rehearse a deploy while the old stack is still
          running; deploy is the real thing.
        required: false
        default: deploy
        type: choice
        options: [deploy, validate]

concurrency:
  group: release-cloud-pi
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  API_IMAGE: ghcr.io/denizlg24/deniz-cloud-api

jobs:
  build-api:
    name: Build and push ARM64 API image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    outputs:
      image_tag: ${{ steps.release.outputs.image_tag }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Log in to GHCR
        if: github.event_name != 'workflow_dispatch' || inputs.image_tag == ''
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set release metadata
        id: release
        env:
          REQUESTED_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ -n "$REQUESTED_TAG" ]]; then
            if [[ ! "$REQUESTED_TAG" =~ ^[0-9a-f]{40}$ ]]; then
              echo "image_tag must be a full Git SHA" >&2
              exit 1
            fi
            echo "image_tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: github.event_name != 'workflow_dispatch' || inputs.image_tag == ''
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        if: github.event_name != 'workflow_dispatch' || inputs.image_tag == ''
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  deploy:
    name: Deploy to Pi
    needs: build-api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pi
    env:
      IMAGE_TAG: ${{ needs.build-api.outputs.image_tag }}
      PI_HOST: ${{ vars.PI_TAILNET_HOST }}
      # Empty on push, so pushes always take the real path.
      DEPLOY_MODE: ${{ inputs.mode || 'deploy' }}
    steps:
      - name: Check out deployment assets
        uses: actions/checkout@v7

      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Validate deployment settings
        run: |
          test -n "$PI_HOST"
          test -n "$IMAGE_TAG"
          [[ "$PI_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]

      - name: Resolve the Pi on the tailnet
        run: |
          # tailscale/github-action leaves --accept-dns=false so it does not
          # clobber runner DNS, which means MagicDNS names never resolve here.
          # tailscaled answers from the netmap without going through DNS.
          if ! PI_ADDR="$(tailscale ip -4 "$PI_HOST")"; then
            tailscale status --peers >&2
            exit 1
          fi
          [[ "$PI_ADDR" =~ ^100\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "PI_ADDR=$PI_ADDR" >> "$GITHUB_ENV"

      - name: Copy infrastructure assets
        run: |
          tar -czf cloud-infra.tgz \
            infra/compose \
            infra/fail2ban \
            infra/network \
            infra/posix-storage \
            infra/samba \
            infra/scripts \
            infra/systemd
          scp \
            -o StrictHostKeyChecking=accept-new \
            -o BatchMode=yes \
            cloud-infra.tgz \
            "denizlg24@${PI_ADDR}:/tmp/cloud-infra.tgz"
          ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes "denizlg24@${PI_ADDR}" \
            "mkdir -p /opt/deniz-cloud && tar -xzf /tmp/cloud-infra.tgz -C /opt/deniz-cloud && rm -f /tmp/cloud-infra.tgz"

      # Renders the compose file against the real .env.pi on the Pi. Proves the
      # env file is present, complete and readable without starting anything.
      - name: Validate compose on the Pi
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes "denizlg24@${PI_ADDR}" \
            "cd /opt/deniz-cloud/infra/compose && test -f .env.pi && API_IMAGE='${API_IMAGE}:${IMAGE_TAG}' API_VERSION='${IMAGE_TAG}' docker compose --env-file .env.pi -f docker-compose.pi.yml config -q"

      - name: Pull images
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes "denizlg24@${PI_ADDR}" \
            "cd /opt/deniz-cloud/infra/compose && API_IMAGE='${API_IMAGE}:${IMAGE_TAG}' API_VERSION='${IMAGE_TAG}' docker compose --env-file .env.pi -f docker-compose.pi.yml pull"

      # Runs in both modes: a validate run should surface a migration that is
      # about to fail, and a dry run never writes. `compose run` reuses the api
      # service so the migration sees exactly the environment and network the
      # server will, without duplicating fifty variables into a second service.
      - name: Report pending migrations
        id: pending
        run: |
          summary="$(ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes "denizlg24@${PI_ADDR}" \
            "cd /opt/deniz-cloud/infra/compose && API_IMAGE='${API_IMAGE}:${IMAGE_TAG}' API_VERSION='${IMAGE_TAG}' docker compose --env-file .env.pi -f docker-compose.pi.yml run --rm --no-deps -T api bun run dist/apply-migrations.js" \
            | tail -n 1)"
          echo "$summary"
          pending="$(jq -r '.pending // [] | join(", ")' <<< "$summary")"
          {
            echo "### Migrations"
            echo
            if [[ -z "$pending" ]]; then
              echo "Schema is up to date; nothing to apply."
            else
              echo "Pending: \`${pending}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Before the stack restarts, so the new code never starts against an old
      # schema. The old container is still serving at this point, which is only
      # safe for additive migrations — a destructive change needs the usual
      # expand/contract split across two deploys.
      - name: Apply migrations
        if: env.DEPLOY_MODE == 'deploy'
        run: |
          if ! ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes "denizlg24@${PI_ADDR}" \
            "cd /opt/deniz-cloud/infra/compose && API_IMAGE='${API_IMAGE}:${IMAGE_TAG}' API_VERSION='${IMAGE_TAG}' docker compose --env-file .env.pi -f docker-compose.pi.yml run --rm --no-deps -T api bun run dist/apply-migrations.js --execute"
          then
            {
              echo
              echo "Migration failed, so the stack was not restarted and the"
              echo "running container still serves the previous image."
              echo
              echo "An \`already exists\` error means the schema was changed"
              echo "out of band and drizzle has no record of it. Mark the"
              echo "affected migrations applied without running them:"
              echo
              echo '```'
              echo "cd /opt/deniz-cloud/infra/compose"
              echo "docker compose --env-file .env.pi -f docker-compose.pi.yml \\"
              echo "  run --rm --no-deps -T api \\"
              echo "  bun run dist/apply-migrations.js --baseline <tag>   # dry run"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # The only step that touches running state. Until cutover the Pi still
      # runs the old stack on the same data directories and ports, so a
      # validate run must stop here.
      - name: Start the stack
        if: env.DEPLOY_MODE == 'deploy'
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes "denizlg24@${PI_ADDR}" \
            "cd /opt/deniz-cloud/infra/compose && API_IMAGE='${API_IMAGE}:${IMAGE_TAG}' API_VERSION='${IMAGE_TAG}' docker compose --env-file .env.pi -f docker-compose.pi.yml up -d"

      - name: Record validate-only run
        if: env.DEPLOY_MODE != 'deploy'
        run: |
          {
            echo "### Validate-only run"
            echo
            echo "Tailnet, SSH, asset copy, GHCR pull and compose render all"
            echo "succeeded against the Pi. No container was started."
            echo
            echo "- image: \`${API_IMAGE}:${IMAGE_TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Health gate
        if: env.DEPLOY_MODE == 'deploy'
        run: |
          for _ in {1..30}; do
            response="$(curl --fail --silent --show-error https://api.denizlg24.com/healthz || true)"
            if jq -e --arg version "$IMAGE_TAG" \
              '.status == "ok" and .version == $version' <<< "$response" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "API did not report version ${IMAGE_TAG}" >&2
          exit 1
