name: Release deploy agent

on:
  push:
    branches: [main]
    paths:
      - "apps/deploy-agent/**"
      - "packages/cloud-core/**"
      - "packages/schemas/**"
      - "infra/systemd/forge-agent.service"
      - "infra/systemd/forge-agent-install"
      - "infra/systemd/forge-buildkit.service"
      - "infra/systemd/forge-buildkitd.toml"
      # Caddy's unit ships with the agent, not on its own. The agent publishes a
      # config that names the access-log directory and only this unit's
      # ReadWritePaths lets Caddy open it; out of step, Caddy 400s the whole
      # config and every deployment stops routing.
      - "infra/systemd/forge-caddy.service"
      - ".github/workflows/release-deploy-agent.yml"
      - "bun.lock"
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          validate exercises the whole path (tailnet, SSH, staging copy,
          checksum) but never installs the binary or restarts the service.
          deploy is the real thing.
        required: false
        default: deploy
        type: choice
        options: [deploy, validate]

concurrency:
  group: release-deploy-agent-forge
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build the agent binary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The agent is the one thing on the deploy host that runs unsandboxed
      # against every repository's build. Shipping it past its own tests would
      # be shipping the least supervised component blind.
      - name: Typecheck and test
        run: |
          bunx turbo typecheck --filter=deploy-agent
          bunx turbo test --filter=deploy-agent

      - name: Compile
        run: bun run --filter=deploy-agent build:host

      - name: Checksum
        run: |
          cd apps/deploy-agent/dist
          sha256sum forge-agent > forge-agent.sha256
          cat forge-agent.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: forge-agent
          path: |
            apps/deploy-agent/dist/forge-agent
            apps/deploy-agent/dist/forge-agent.sha256
          retention-days: 14
          if-no-files-found: error

  deploy:
    name: Deploy to the forge host
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Manual approval gate, same as the Pi. A green build is not a rollout.
    environment: forge
    env:
      FORGE_HOST: ${{ vars.FORGE_TAILNET_HOST }}
      DEPLOY_MODE: ${{ inputs.mode || 'deploy' }}
      DR_FENCING_ENABLED: ${{ vars.DR_FORGE_FENCING_ENABLED }}
    steps:
      - name: Check out service assets
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: forge-agent
          path: dist

      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Validate deployment settings
        run: |
          test -n "$FORGE_HOST"
          [[ "$FORGE_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ -z "$DR_FENCING_ENABLED" || "$DR_FENCING_ENABLED" == true ]]

      - name: Resolve the host on the tailnet
        run: |
          # tailscale/github-action leaves --accept-dns=false so MagicDNS names
          # never resolve here; tailscaled answers from the netmap instead.
          if ! FORGE_ADDR="$(tailscale ip -4 "$FORGE_HOST")"; then
            tailscale status --peers >&2
            exit 1
          fi
          [[ "$FORGE_ADDR" =~ ^100\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "FORGE_ADDR=$FORGE_ADDR" >> "$GITHUB_ENV"

      - name: Fence the Forge backup snapshot
        if: env.DR_FENCING_ENABLED == 'true'
        env:
          # A backup snapshot legitimately holds this for a while, so waiting is
          # the normal case rather than an error. `mkdir` on its own turned any
          # concurrent backup into a failed release.
          DR_LOCK_WAIT_SECONDS: "900"
          # Past this, a fence is not held by anything that will ever release
          # it: nothing else reclaims it, so every later run fails until someone
          # removes a directory on the host by hand.
          DR_LOCK_STALE_MINUTES: "60"
        run: |
          lock_token="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-forge-agent"
          [[ "$lock_token" =~ ^[0-9]+-[0-9]+-forge-agent$ ]]
          ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes "denizlg24@${FORGE_ADDR}" \
            bash -s -- "$lock_token" "$DR_LOCK_WAIT_SECONDS" "$DR_LOCK_STALE_MINUTES" <<'REMOTE'
          set -euo pipefail
          token="$1"; wait_seconds="$2"; stale_minutes="$3"
          lease="$(dig @1.1.1.1 +short TXT _active-site-forge.denizlg24.com | tr -d '"' | head -1)"
          test "$lease" = home
          lock=/var/lib/deniz-dr/locks/forge.lock
          holder() { cat "$lock/owner" 2>/dev/null || echo unknown; }
          deadline=$(( $(date +%s) + wait_seconds ))
          while true; do
            if mkdir "$lock" 2>/dev/null; then break; fi
            # `find -mmin` rather than `stat`: the age test decides whether the
            # fence is ever breakable, so it must not be the half of a `||`
            # that silently answers "not stale" where the syntax is wrong.
            if [ -n "$(find "$lock" -maxdepth 0 -mmin "+${stale_minutes}" 2>/dev/null)" ]; then
              echo "breaking a deploy fence abandoned by '$(holder)'" >&2
              # Rename first: whoever wins the rename wins the break, so two
              # runners cannot both clear it and both proceed.
              if mv "$lock" "${lock}.abandoned.$$" 2>/dev/null; then
                rm -rf "${lock}.abandoned.$$"
              fi
              continue
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "deploy fence still held after ${wait_seconds}s by '$(holder)'" >&2
              exit 1
            fi
            sleep 10
          done
          printf '%s\n' "$token" > "$lock/owner"
          REMOTE
          echo "DR_DEPLOY_LOCK_TOKEN=$lock_token" >> "$GITHUB_ENV"

      - name: Record deferred DR fencing
        if: env.DR_FENCING_ENABLED != 'true'
        run: echo '::notice::Forge DR fencing is deferred until DR_FORGE_FENCING_ENABLED is set to true.'

      - name: Package current disaster-recovery tooling
        run: |
          tar -czf dr-runtime.tgz \
            --exclude='infra/dr/opentofu/.terraform' \
            --exclude='*.tfstate' \
            --exclude='*.tfstate.*' \
            infra/dr \
            infra/scripts/posix-namespace-backup.sh \
            infra/scripts/posix-namespace-restore-verify.sh
      - name: Stage the binary
        run: |
          scp \
            -o StrictHostKeyChecking=accept-new \
            -o BatchMode=yes \
            dist/forge-agent \
            "denizlg24@${FORGE_ADDR}:/var/lib/forge-agent/staging/forge-agent"
          scp \
            -o StrictHostKeyChecking=accept-new \
            -o BatchMode=yes \
            infra/systemd/forge-agent.service \
            infra/systemd/forge-caddy.service \
            infra/systemd/forge-buildkit.service \
            infra/systemd/forge-buildkitd.toml \
            infra/systemd/forge-agent-install \
            dr-runtime.tgz \
            "denizlg24@${FORGE_ADDR}:/var/lib/forge-agent/staging/"

      # scp reports success on a short write often enough to be worth one
      # round trip. The install script refuses an empty file; this catches a
      # corrupt one, which is the failure that otherwise surfaces as a service
      # that restart-loops with no useful message.
      - name: Verify the staged checksum
        run: |
          expected="$(cut -d' ' -f1 dist/forge-agent.sha256)"
          actual="$(ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            "denizlg24@${FORGE_ADDR}" \
            "sha256sum /var/lib/forge-agent/staging/forge-agent | cut -d' ' -f1")"
          echo "expected $expected"
          echo "actual   $actual"
          [ "$expected" = "$actual" ]

      - name: Install and restart
        if: env.DEPLOY_MODE == 'deploy'
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            "denizlg24@${FORGE_ADDR}" \
            "sudo /usr/local/sbin/forge-agent-install && sudo /usr/local/sbin/forge-agent-install --install-dr-runtime"

      # /healthz is deliberately unauthenticated and the runner is on the
      # tailnet, so this asks the agent directly rather than trusting
      # `systemctl is-active`, which is true for a process that started and
      # then failed to bind.
      - name: Health gate
        if: env.DEPLOY_MODE == 'deploy'
        run: |
          for _ in {1..20}; do
            if curl --fail --silent --show-error --max-time 5 \
              "http://${FORGE_ADDR}:4010/healthz" > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 3
          done
          echo "agent did not answer /healthz" >&2
          ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            "denizlg24@${FORGE_ADDR}" \
            "journalctl -u forge-agent -n 50 --no-pager" >&2 || true
          exit 1

      - name: Clean up staging after a validate run
        if: env.DEPLOY_MODE != 'deploy'
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            "denizlg24@${FORGE_ADDR}" \
            "rm -f /var/lib/forge-agent/staging/forge-agent /var/lib/forge-agent/staging/forge-agent.service /var/lib/forge-agent/staging/forge-caddy.service /var/lib/forge-agent/staging/forge-buildkit.service /var/lib/forge-agent/staging/forge-buildkitd.toml /var/lib/forge-agent/staging/forge-agent-install /var/lib/forge-agent/staging/dr-runtime.tgz"
          {
            echo "### Validate-only run"
            echo
            echo "Tailnet, SSH, staging copy and checksum all succeeded."
            echo "Nothing was installed and the service was not restarted."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Release the Forge backup fence
        if: always() && env.DR_DEPLOY_LOCK_TOKEN != ''
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes "denizlg24@${FORGE_ADDR}" \
            bash -s -- "$DR_DEPLOY_LOCK_TOKEN" <<'REMOTE'
          set -euo pipefail
          token="$1"
          lock=/var/lib/deniz-dr/locks/forge.lock
          owner="$(cat "$lock/owner" 2>/dev/null || true)"
          if [ "$owner" != "$token" ]; then
            # Someone else holds it — this run's fence was already broken as abandoned,
            # or never taken. Removing it would unfence a live backup. Not this step's
            # failure to report either: the release it guarded has already finished.
            echo "deploy fence is held by '${owner:-nothing}', not this run; leaving it" >&2
            exit 0
          fi
          rm -f "$lock/owner"
          rmdir "$lock"
          REMOTE
