name: Macros mobile

# Secret-free validation builds run on pull requests and manual dispatch.
# A version bump on main uploads an iOS build to TestFlight and publishes the
# signed Android APK. Release jobs alone use the approved `macros-release`
# environment; signing credentials must be environment secrets.

on:
  push:
    branches: ["main"]
    paths:
      - "apps/macros-mobile/package.json"
      - ".github/workflows/macros-mobile.yml"
  pull_request:
    paths:
      - "apps/macros-mobile/**"
      - "packages/macros-core/**"
      - "packages/schemas/src/macros/**"
      - "bun.lock"
      - ".github/workflows/macros-mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

# Pull requests share a group per ref and cancel superseded runs. Everything
# else gets a group of its own: a shared group would let a newer push silently
# replace a pending version-bump run, and one release waiting for approval
# would hold every later run on main.
concurrency:
  group: macros-mobile-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    name: Detect release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect version change
        id: version
        shell: bash
        run: |
          current_version="$(jq -r '.version' apps/macros-mobile/package.json)"
          echo "version=$current_version" >> "$GITHUB_OUTPUT"
          publish=false
          if [[ "${{ github.event_name }}" == "push" ]]; then
            previous_version="$(
              git show "${{ github.event.before }}:apps/macros-mobile/package.json" 2>/dev/null |
                jq -r '.version' || true
            )"
            if [[ "$current_version" != "$previous_version" ]]; then
              tag="macros-android-v$current_version"
              if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
                echo "::error::$tag already exists. Bump apps/macros-mobile/package.json."
                exit 1
              fi
              publish=true
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  verify:
    name: Typecheck and test mobile code
    needs: prepare
    if: github.event_name == 'pull_request' || needs.prepare.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: apps/macros-mobile
        run: bun run typecheck
      - name: Test mobile code
        working-directory: apps/macros-mobile
        run: bun test
      - name: Test shared domain logic
        working-directory: packages/macros-core
        run: bun test

  build-ios:
    name: Build iOS (unsigned)
    needs: [prepare, verify]
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      MACROS_IOS_BUILD_NUMBER: ${{ github.run_number }}
      MACROS_IOS_APS_ENVIRONMENT: production
      VERSION: ${{ needs.prepare.outputs.version }}
    defaults:
      run:
        working-directory: apps/macros-mobile
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Xcode's "Bundle React Native code and images" phase runs the Expo CLI
      # under node, so the runner needs a node React Native 0.86 accepts.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Generate the native project
        run: bunx expo prebuild --platform ios --clean

      - name: Check generated entitlements
        run: |
          bun scripts/ios-entitlements.ts --unsigned ios/Macros/Macros.entitlements
          bun scripts/ios-entitlements.ts --target MacrosWidgetExtension \
            --unsigned ios/MacrosWidgetExtension/MacrosWidgetExtension.entitlements

      - name: Archive
        shell: bash
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace ios/Macros.xcworkspace \
            -scheme Macros \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Macros.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            | tee "$RUNNER_TEMP/xcodebuild.log" \
            | xcbeautify --renderer github-actions

      - name: Package IPA
        shell: bash
        run: |
          app="$RUNNER_TEMP/Macros.xcarchive/Products/Applications/Macros.app"
          if [[ ! -d "$app" ]]; then
            echo "::error::The archive holds no Macros.app"
            exit 1
          fi
          mkdir -p build/Payload
          cp -R "$app" build/Payload/
          (cd build && zip -qry "Macros-$VERSION.ipa" Payload)
          ls -l build

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: macros-ios-${{ needs.prepare.outputs.version }}
          path: apps/macros-mobile/build/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macros-ios-xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

  build-android:
    name: Build APK
    needs: [prepare, verify]
    if: github.event_name == 'pull_request' || needs.prepare.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MACROS_ANDROID_VERSION_CODE: ${{ github.run_number }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: macros-android-v${{ needs.prepare.outputs.version }}
    defaults:
      run:
        working-directory: apps/macros-mobile
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Gradle's "bundle JS" task runs the Expo CLI under node.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile

      # No MACROS_ANDROID_* variables here, so plugins/with-android-signing.js
      # leaves the template alone and Gradle signs with the debug key.
      # release-android replaces that signature.
      - name: Generate the native project
        run: bunx expo prebuild --platform android --clean --no-install

      - name: Assemble
        working-directory: apps/macros-mobile/android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleRelease \
            --no-daemon \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
            -Dorg.gradle.jvmargs=-Xmx4g \
            | tee "$RUNNER_TEMP/gradle.log"

      - name: Package APK
        shell: bash
        run: |
          apk="android/app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$apk" ]]; then
            echo "::error::Gradle produced no app-release.apk"
            exit 1
          fi
          if ! unzip -l "$apk" | grep -q 'assets/index.android.bundle'; then
            echo "::error::The APK carries no embedded JS bundle"
            exit 1
          fi
          mkdir -p build
          cp "$apk" "build/Macros-$VERSION.apk"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/apksigner" verify --print-certs "build/Macros-$VERSION.apk"
          ls -l build

      - name: Write release notes
        shell: bash
        run: |
          previous_tag="$(
            git tag --list 'macros-android-v*' --sort=-v:refname |
              grep -Fvx "$TAG" |
              head -n 1 ||
              true
          )"
          if [[ -n "$previous_tag" ]]; then
            git log --format='- %s' "$previous_tag..HEAD" -- . ../../packages/macros-core > build/release-notes.md
          else
            git log --format='- %s' -n 30 HEAD -- . > build/release-notes.md
          fi
          if [[ ! -s build/release-notes.md ]]; then
            echo "- Maintenance release." > build/release-notes.md
          fi
          cat build/release-notes.md

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: macros-android-${{ needs.prepare.outputs.version }}
          path: |
            apps/macros-mobile/build/*.apk
            apps/macros-mobile/build/release-notes.md
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macros-android-gradle-log
          path: ${{ runner.temp }}/gradle.log
          if-no-files-found: ignore
          retention-days: 7

  release-ios:
    name: Upload to TestFlight
    needs: [prepare, verify]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    environment: macros-release
    # Profile names are reused, so releases must not recreate them concurrently.
    concurrency:
      group: macros-mobile-release-ios
      cancel-in-progress: false
    env:
      MACROS_IOS_BUILD_NUMBER: ${{ github.run_number }}
      MACROS_IOS_APS_ENVIRONMENT: production
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    defaults:
      run:
        working-directory: apps/macros-mobile
    steps:
      - name: Check signing setup
        id: signing
        shell: bash
        working-directory: .
        env:
          APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          APPLE_ASC_PRIVATE_KEY: ${{ secrets.APPLE_ASC_PRIVATE_KEY }}
          MACROS_IOS_DIST_CERT_P12: ${{ secrets.MACROS_IOS_DIST_CERT_P12 }}
          MACROS_IOS_DIST_CERT_PASSWORD: ${{ secrets.MACROS_IOS_DIST_CERT_PASSWORD }}
        run: |
          missing=()
          for name in APPLE_TEAM_ID APPLE_ASC_KEY_ID APPLE_ASC_ISSUER_ID \
            APPLE_ASC_PRIVATE_KEY MACROS_IOS_DIST_CERT_P12 \
            MACROS_IOS_DIST_CERT_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::notice::App Store distribution is not set up (missing: ${missing[*]}). Nothing to do."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out code
        if: steps.signing.outputs.ready == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode
        if: steps.signing.outputs.ready == 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Xcode's "Bundle React Native code and images" phase runs the Expo CLI
      # under node, so the runner needs a node React Native 0.86 accepts.
      - name: Set up Node
        if: steps.signing.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - if: steps.signing.outputs.ready == 'true'
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        if: steps.signing.outputs.ready == 'true'
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Test release tooling
        if: steps.signing.outputs.ready == 'true'
        run: bun test scripts

      - name: Import the distribution certificate
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        env:
          P12_BASE64: ${{ secrets.MACROS_IOS_DIST_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACROS_IOS_DIST_CERT_PASSWORD }}
        run: |
          p12="$RUNNER_TEMP/distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/macros-signing.keychain-db"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "$P12_BASE64" | base64 --decode > "$p12"
          keychain_password="$(openssl rand -hex 24)"

          security create-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security import "$p12" -P "$P12_PASSWORD" -A -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$KEYCHAIN_PATH" >/dev/null
          read -r -a existing_keychains <<< "$(security list-keychains -d user | tr -d '"' | xargs)"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "${existing_keychains[@]}"

          # The profile has to name this exact certificate. Keychain Access
          # exports with legacy encryption, which OpenSSL 3 reads only with
          # -legacy; LibreSSL refuses that flag.
          /usr/bin/openssl pkcs12 -in "$p12" -clcerts -nokeys -passin env:P12_PASSWORD -out "$RUNNER_TEMP/distribution.pem" 2>/dev/null ||
            openssl pkcs12 -legacy -in "$p12" -clcerts -nokeys -passin env:P12_PASSWORD -out "$RUNNER_TEMP/distribution.pem"
          rm -f "$p12"

      - name: Create App Store profiles
        if: steps.signing.outputs.ready == 'true'
        env:
          APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          APPLE_ASC_PRIVATE_KEY: ${{ secrets.APPLE_ASC_PRIVATE_KEY }}
        run: >
          bun scripts/store-profile.ts
          --certificate "$RUNNER_TEMP/distribution.pem"
          --out-dir build/profiles
          --summary build/profile.json

      - name: Install the profiles
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          # Xcode 16 reads the second location; older Xcodes the first.
          jq -r '.profiles[] | "\(.uuid) \(.file)"' build/profile.json |
            while read -r uuid file; do
              for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
                mkdir -p "$dir"
                cp "$file" "$dir/$uuid.mobileprovision"
              done
            done

      - name: Generate the native project
        if: steps.signing.outputs.ready == 'true'
        run: bunx expo prebuild --platform ios --clean

      # Only the app and widget targets are signed with their profiles.
      # Passing a profile on the xcodebuild command line would apply it to
      # every Pods target too, which refuse one.
      - name: Sign the app and widget targets manually
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          # CocoaPods (which prebuild just ran) brings the gem; install it only
          # if this Ruby cannot see it.
          ruby -e 'require "xcodeproj"' 2>/dev/null || gem install xcodeproj --no-document
          ruby -r xcodeproj -r json -e '
            project = Xcodeproj::Project.open("ios/Macros.xcodeproj")
            JSON.parse(File.read("build/profile.json"))["profiles"].each do |profile|
              target = project.targets.find { |t| t.name == profile["target"] } or abort "No #{profile["target"]} target"
              target.build_configurations.each do |config|
                settings = config.build_settings
                settings["CODE_SIGN_STYLE"] = "Manual"
                settings["DEVELOPMENT_TEAM"] = ENV.fetch("APPLE_TEAM_ID")
                settings["PROVISIONING_PROFILE_SPECIFIER"] = profile["name"]
                settings["CODE_SIGN_IDENTITY"] = "Apple Distribution"
                settings["CODE_SIGN_IDENTITY[sdk=iphoneos*]"] = "Apple Distribution"
              end
            end
            project.save
          '

      - name: Archive
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace ios/Macros.xcworkspace \
            -scheme Macros \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Macros.xcarchive" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            | tee "$RUNNER_TEMP/xcodebuild.log" \
            | xcbeautify --renderer github-actions

      - name: Check signed entitlements before upload
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          app="$RUNNER_TEMP/Macros.xcarchive/Products/Applications/Macros.app"
          bun scripts/ios-entitlements.ts "$app"
          bun scripts/ios-entitlements.ts --target MacrosWidgetExtension \
            "$app/PlugIns/MacrosWidgetExtension.appex"

      - name: Upload archive to App Store Connect
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        env:
          APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          APPLE_ASC_PRIVATE_KEY: ${{ secrets.APPLE_ASC_PRIVATE_KEY }}
        run: |
          set -o pipefail
          auth_key="$RUNNER_TEMP/AuthKey_$APPLE_ASC_KEY_ID.p8"
          printf '%s\n' "$APPLE_ASC_PRIVATE_KEY" > "$auth_key"
          chmod 600 "$auth_key"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
          $(jq -r '.profiles[] | "    <key>\(.bundleIdentifier)</key>\n    <string>\(.name)</string>"' build/profile.json)
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Macros.xcarchive" \
            -exportPath build/export \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -authenticationKeyPath "$auth_key" \
            -authenticationKeyID "$APPLE_ASC_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_ASC_ISSUER_ID" \
            | tee -a "$RUNNER_TEMP/xcodebuild.log" \
            | xcbeautify --renderer github-actions
          rm -f "$auth_key"

      - name: Save debug symbols
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: macros-ios-dsyms-${{ needs.prepare.outputs.version }}
          path: ${{ runner.temp }}/Macros.xcarchive/dSYMs/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macros-ios-store-xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove signing material
        if: always()
        shell: bash
        working-directory: .
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi
          rm -f "$RUNNER_TEMP/distribution.pem"
          rm -rf apps/macros-mobile/build/profiles
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision
          rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision

  release-android:
    name: Sign and publish APK
    needs: [prepare, build-android]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: macros-release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: macros-android-v${{ needs.prepare.outputs.version }}
      MACROS_ANDROID_KEYSTORE: ${{ secrets.MACROS_ANDROID_KEYSTORE }}
      MACROS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MACROS_ANDROID_KEYSTORE_PASSWORD }}
      MACROS_ANDROID_KEY_ALIAS: ${{ secrets.MACROS_ANDROID_KEY_ALIAS }}
      MACROS_ANDROID_KEY_PASSWORD: ${{ secrets.MACROS_ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check signing secrets
        id: signing
        shell: bash
        run: |
          if [[ -n "$MACROS_ANDROID_KEYSTORE" && -n "$MACROS_ANDROID_KEYSTORE_PASSWORD" && -n "$MACROS_ANDROID_KEY_ALIAS" && -n "$MACROS_ANDROID_KEY_PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::The MACROS_ANDROID_* signing secrets are not set, so $TAG was built but not published."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download build
        if: steps.signing.outputs.ready == 'true'
        uses: actions/download-artifact@v8
        with:
          name: macros-android-${{ needs.prepare.outputs.version }}
          path: dist

      # apksigner replaces the debug signature outright. zipalign runs first
      # because rewriting the archive after signing would invalidate it; -P 16
      # keeps native libraries on 16 KB pages.
      - name: Sign with the release key
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          keystore="$RUNNER_TEMP/macros-release.keystore"
          echo "$MACROS_ANDROID_KEYSTORE" | base64 --decode > "$keystore"
          chmod 600 "$keystore"

          "$build_tools/zipalign" -f -P 16 4 "dist/Macros-$VERSION.apk" "$RUNNER_TEMP/aligned.apk"
          "$build_tools/apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$MACROS_ANDROID_KEY_ALIAS" \
            --ks-pass env:MACROS_ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:MACROS_ANDROID_KEY_PASSWORD \
            --out "dist/Macros-$VERSION.apk" \
            "$RUNNER_TEMP/aligned.apk"
          rm -f "$keystore" "$RUNNER_TEMP/aligned.apk"

          "$build_tools/apksigner" verify --print-certs "dist/Macros-$VERSION.apk" | tee "$RUNNER_TEMP/signature.txt"
          if grep -q "CN=Android Debug" "$RUNNER_TEMP/signature.txt"; then
            echo "::error::The release APK is still signed with the debug key."
            exit 1
          fi
          # apksigner prefixes each line with the scheme ("V3.0 Signer:") or the
          # signer index ("Signer #1"), depending on its version and minSdk, and
          # repeats a signer once per scheme; distinct digests are the signers.
          signers="$(grep -E 'certificate SHA-256 digest:' "$RUNNER_TEMP/signature.txt" | awk '{print $NF}' | sort -u | wc -l | tr -d ' ')"
          if [[ "$signers" != "1" ]]; then
            echo "::error::The release APK has $signers signers; expected exactly one."
            exit 1
          fi

      # Never "latest": the Envoy CLI's updater reads this repository's
      # releases, and the repository's latest release must stay an Envoy one.
      - name: Create GitHub release
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Macros Android v$VERSION" \
            --notes-file dist/release-notes.md \
            --latest=false \
            "dist/Macros-$VERSION.apk"
