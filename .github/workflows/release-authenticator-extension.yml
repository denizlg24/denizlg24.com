name: Release Authenticator Extension

on:
  push:
    branches: ["main"]
    paths:
      - "apps/authenticator-extension/package.json"
      - ".github/workflows/release-authenticator-extension.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-authenticator-extension
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect version change
        id: version
        shell: bash
        run: |
          current_version="$(jq -r '.version' apps/authenticator-extension/package.json)"

          if [[ "${{ github.event_name }}" != "push" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "tag=ext-v$current_version" >> "$GITHUB_OUTPUT"
            echo "version=$current_version" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous_version="$(
            git show "${{ github.event.before }}:apps/authenticator-extension/package.json" 2>/dev/null |
              jq -r '.version' ||
              true
          )"

          if [[ "$current_version" == "$previous_version" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The release workflow changed, but the extension version did not."
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "tag=ext-v$current_version" >> "$GITHUB_OUTPUT"
          echo "version=$current_version" >> "$GITHUB_OUTPUT"

  build:
    name: Build and verify
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: bun run typecheck
        working-directory: apps/authenticator-extension

      - name: Test
        run: bun test
        working-directory: apps/authenticator-extension

      - name: Package
        run: bun run package
        working-directory: apps/authenticator-extension

      - name: Check the manifests carry the released version
        shell: bash
        run: |
          for target in chrome firefox; do
            manifest_version="$(jq -r '.version' "apps/authenticator-extension/dist/$target/manifest.json")"
            if [[ "$manifest_version" != "${{ needs.prepare.outputs.version }}" ]]; then
              echo "$target manifest is $manifest_version, expected ${{ needs.prepare.outputs.version }}"
              exit 1
            fi
          done

      # AMO runs this same linter at submission. Failing here costs a minute;
      # failing there costs a rejected review round.
      - name: Validate the Firefox package
        run: bunx --bun web-ext lint --source-dir dist/firefox --output text
        working-directory: apps/authenticator-extension

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-packages
          path: apps/authenticator-extension/release/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [prepare, build]
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: extension-packages
          path: artifacts

      - name: Build release notes
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          previous_tag="$(
            git tag --list 'ext-v*' --sort=-v:refname |
              grep -Fvx "$TAG" |
              head -n 1 ||
              true
          )"

          if [[ -n "$previous_tag" ]]; then
            changes="$(git log --format='- %s (`%h`)' "$previous_tag..HEAD" -- apps/authenticator-extension)"
          else
            changes="$(git log --format='- %s (`%h`)' HEAD -- apps/authenticator-extension)"
          fi

          if [[ -z "$changes" ]]; then
            changes="- Release metadata only."
          fi

          {
            echo "## Authenticator extension v$VERSION"
            echo
            echo "$changes"
            echo
            echo "Upload \`*-chrome-*.zip\` to the Chrome Web Store and"
            echo "\`*-firefox-*.zip\` to AMO, with \`*-source-*.zip\` as the"
            echo "required source submission. Submission notes:"
            echo "https://github.com/${{ github.repository }}/blob/$TAG/apps/authenticator-extension/store/listing.md"
          } > extension-release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Authenticator extension v${{ needs.prepare.outputs.version }}
          body_path: extension-release-notes.md
          make_latest: false
          files: artifacts/*.zip
