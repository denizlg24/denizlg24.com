[project]
name = "macros-vision"
version = "0.1.0"
description = "Private nutrition-label OCR and food classification service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.140.8",
  "numpy==2.4.2",
  "onnxruntime==1.27.0",
  "pillow==12.1.1",
  "pydantic==2.12.5",
  "python-multipart==0.0.22",
  "rapidocr==3.9.2",
  "uvicorn[standard]==0.41.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.0.2",
  "pytest-cov==7.0.0",
  "ruff==0.15.2",
]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
